faqs:
  - q: Do I need an appointment?
    a: Appointments are recommended, but we take walk-ins for oil changes, smog checks, and battery tests when we have room.
  - q: Do you offer a warranty on repairs?
    a: Yes. Repairs come with a 12-month / 12,000-mile warranty on parts and labor.
  - q: Do you offer loaner cars or rides?
    a: We have a free shuttle within 5 miles of the shop. We do not offer loaner cars.
  - q: What forms of payment do you accept?
    a: Cash, all major credit and debit cards, and we offer financing through Synchrony for repairs over $500.
  - q: Which vehicles do you work on?
    a: Most domestic, Asian, and European cars, SUVs, and light trucks. We do not work on diesel trucks over 10,000 lbs or on RVs.
  - q: Do you speak Spanish or Punjabi?
    a: Yes. Our team speaks English, Spanish, and Punjabi.
  - q: How long does a brake job take?
    a: Most brake jobs are done the same day if the car is dropped off by 10 AM, but the shop will confirm after inspecting the vehicle.

policies:
  - Prices listed are estimates. The final price is given after we inspect the vehicle, and we get your approval before starting any work.
  - The $95 diagnostic fee is credited toward the repair if you approve it.
  - Cars left after hours can be dropped in our key drop box by the front door.
  - Unclaimed vehicles are subject to a $20 per day storage fee after 3 days from the "ready" notice.
