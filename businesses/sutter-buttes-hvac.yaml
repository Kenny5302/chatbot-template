faqs:
  - q: Do you offer free estimates?
    a: Yes, free in-home estimates for system replacements. Repairs start with an $89 service call, credited toward the repair if you approve it.
  - q: Do you offer financing?
    a: Yes, we offer 12-month same-as-cash financing and longer monthly plans, subject to credit approval.
  - q: What areas do you serve?
    a: Yuba City, Marysville, Live Oak, Gridley, Wheatland, and Olivehurst.
  - q: Do you offer a maintenance plan?
    a: Yes. The Comfort Club is $14 per month and includes two tune-ups a year and priority scheduling.
  - q: Do you work on all brands?
    a: We service all major brands, and we install Carrier and Lennox systems.
  - q: Do you offer emergency service?
    a: Yes. After-hours emergency visits are available for no cooling in extreme heat, no heat, and refrigerant or water leaks. An after-hours fee applies.
  - q: Are your technicians licensed?
    a: Yes. We are a licensed and insured California contractor, and technicians are background checked.

policies:
